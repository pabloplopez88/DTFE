# DTFE configuration file for the demo
# Run from the main directory of the repository with:
#     ./DTFE --config demo/config_DTFE.cfg
# Every option can also be given on the command line (same names, e.g. '--grid 256'); see './DTFE --help'.
# Everything after '#' is a comment.

# Input snapshot and root name of the output file(s) (paths are relative to where you run DTFE)
inputFile  = demo/gadget4_L50_N64_snap001.hdf5    # Gadget-4 HDF5 snapshot: 64^3 DM particles in a 50 Mpc box
outputFile = demo/demo_output                      # writes 'demo/demo_output.den'

# Input file type and which data to read - same as '--input 105 3' on the command line
input = 105        # 105 = Gadget HDF5 file
input = 3          # data to read: 1 = positions + 2 = masses (velocities are not needed for the density)

# Units of the positions: value of 1 Mpc in the units of the input data (positions in Mpc -> 1)
MpcUnit = 1

# Grid size along each axis - same as '--grid 256' (a single value is used for all axes)
grid = 256

# Periodic box (no value needed) - same as '--periodic'
# Without it the cells close to the box edges/corners are left empty (density = 0).
periodic =

# Fields to compute - same as '--field density'
field = density
